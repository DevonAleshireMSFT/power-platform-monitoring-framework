# =============================================================================
# Deploy – Dev Environment
#
# Triggered on every push to `dev` that touches the solution source or
# workflow files. Can also be triggered manually via workflow_dispatch.
#
# Packs the solution as unmanaged and imports it to the dev Power Platform
# environment using a service principal.
#
# Required GitHub Secrets (set under Settings → Secrets → Actions):
#   PP_CLIENT_ID            Azure App Registration client ID
#   PP_CLIENT_SECRET        Azure App Registration client secret
#   PP_TENANT_ID            Azure AD tenant ID
#   PP_DEV_ENVIRONMENT_URL  Dev environment URL
#                           e.g. https://org05d9d92f.crm.microsoftdynamics.us/
#   PP_DV_CONNECTION_ID     Dataverse connection ID from the maker portal
#                           (Data → Connections → Dataverse → copy ID from URL)
#   PP_TEAMS_CONNECTION_ID  Teams connection ID from the maker portal
#   PP_SP_CONNECTION_ID     SharePoint connection ID from the maker portal
#
# Service principal setup:
#   1. Register an app in Entra ID.
#   2. In the Power Platform admin centre, add the app as an application user
#      in the dev environment and assign it the System Administrator role.
#   3. Store the client ID, secret, and tenant ID as secrets above.
# =============================================================================
name: Deploy – Dev Environment

on:
  push:
    branches: [dev]
    paths:
      - 'PowerPlatformMonitoringFramework/**'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

# Prevent parallel deploys to the same environment.
concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy-dev:
    name: Pack & import to Dev
    runs-on: windows-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract solution version
        id: version
        shell: pwsh
        run: |
          [xml]$sol = Get-Content "PowerPlatformMonitoringFramework/Other/Solution.xml"
          $version  = $sol.ImportExportXml.SolutionManifest.Version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Solution version: $version"

      - name: Install PAC CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Pack solution (unmanaged)
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: PowerPlatformMonitoringFramework
          solution-file: out/PowerPlatformMonitoringFramework_unmanaged.zip
          solution-type: Unmanaged
          process-canvas-apps: false

      - name: Generate deployment settings
        shell: pwsh
        run: |
          $settings = @{
            EnvironmentVariables = @()
            ConnectionReferences  = @(
              @{ LogicalName = "ppmf_DataverseConnectionReference";  ConnectionId = "${{ secrets.PP_DV_CONNECTION_ID }}" }
              @{ LogicalName = "ppmf_TeamsConnectionReference";      ConnectionId = "${{ secrets.PP_TEAMS_CONNECTION_ID }}" }
              @{ LogicalName = "ppmf_SharePointConnectionReference"; ConnectionId = "${{ secrets.PP_SP_CONNECTION_ID }}" }
            )
          }
          $settings | ConvertTo-Json -Depth 5 | Set-Content out/deploymentsettings.json
          Write-Host "Deployment settings written."

      - name: Import to Dev environment
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ secrets.PP_DEV_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          cloud: UsGovHigh
          solution-file: out/PowerPlatformMonitoringFramework_unmanaged.zip
          deployment-settings-file: out/deploymentsettings.json
          force-overwrite: true
          publish-changes: true
          skip-dependency-check: false

      - name: Deployment health check
        shell: pwsh
        run: |
          $secret = ConvertTo-SecureString "${{ secrets.PP_CLIENT_SECRET }}" -AsPlainText -Force
          .\scripts\Test-PPMFDeployment.ps1 `
            -EnvironmentUrl  "${{ secrets.PP_DEV_ENVIRONMENT_URL }}" `
            -ClientId        "${{ secrets.PP_CLIENT_ID }}" `
            -ClientSecret    $secret `
            -TenantId        "${{ secrets.PP_TENANT_ID }}" `
            -Cloud           "UsGovHigh" `
            -ExpectedVersion "${{ steps.version.outputs.version }}"
