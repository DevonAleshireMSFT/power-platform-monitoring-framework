# =============================================================================
# Release – Pack, Publish, and Deploy Production
#
# Triggered when a version tag matching v#.#.#.# is pushed to the repository.
# Example: git tag v1.0.0.10 && git push origin v1.0.0.10
#
# Steps:
#   1. Validate that the tag version matches Solution.xml <Version>.
#   2. Pack unmanaged and managed solution zips.
#   3. Create a GitHub Release with both zips as downloadable assets.
#   4. Import the managed solution to the production environment.
#   5. Re-activate flows (managed import always deactivates them).
#   6. Run post-deploy health check against production.
#   7. Merge main back into dev to keep branch histories in sync.
#
# Pre-release checklist (do this before tagging):
#   - Update <Version> in PowerPlatformMonitoringFramework/Other/Solution.xml
#   - Merge feature branches → dev, validate in dev, then merge dev → main
#   - Tag main: git tag v1.0.0.10 && git push origin v1.0.0.10
#
# Required GitHub Secrets (set under Settings → Secrets → Actions):
#   PP_CLIENT_ID              Azure App Registration client ID
#   PP_CLIENT_SECRET          Azure App Registration client secret
#   PP_TENANT_ID              Azure AD tenant ID
#   PP_PROD_ENVIRONMENT_URL   Production environment URL
#                             e.g. https://yourorg.crm.microsoftdynamics.us/
#   PP_DV_CONNECTION_ID       Dataverse connection ID (prod) from the maker portal
#   PP_TEAMS_CONNECTION_ID    Teams connection ID (prod) from the maker portal
#   PP_SP_CONNECTION_ID       SharePoint connection ID (prod) from the maker portal
#
# The same service principal used for dev can be used here if it has been
# added as an application user with System Administrator in the prod environment.
# For tighter security, use a separate production-only service principal and
# store its credentials as separate secrets (PP_PROD_CLIENT_ID, etc.).
# =============================================================================
name: Release – Pack & Deploy Production

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Pack, publish release, deploy to Production
    runs-on: windows-latest
    environment: production

    # Required to create a GitHub Release and upload assets.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Extract version from tag ──────────────────────────────────────────
      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $tag     = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "TAG=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Tag: $tag  |  Version: $version"

      # ── Validate tag matches Solution.xml ────────────────────────────────
      - name: Validate version matches Solution.xml
        shell: pwsh
        run: |
          $xml             = [xml](Get-Content "PowerPlatformMonitoringFramework/Other/Solution.xml" -Raw)
          $solutionVersion = $xml.ImportExportXml.SolutionManifest.Version
          $tagVersion      = "${{ steps.version.outputs.VERSION }}"

          if ($solutionVersion -ne $tagVersion) {
            Write-Error @"
          Version mismatch detected.
            Tag version      : $tagVersion
            Solution.xml     : $solutionVersion
          Update <Version> in Solution.xml and re-tag.
          "@
            exit 1
          }

          Write-Host "Version confirmed: $solutionVersion"

      # ── Extract changelog entry for this version ──────────────────────────
      - name: Extract changelog entry
        id: changelog
        shell: pwsh
        run: |
          $version   = "${{ steps.version.outputs.VERSION }}"
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern   = "(?s)## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=\n## \[|\z)"

          if ($changelog -match $pattern) {
            $body = $matches[1].Trim()
            Write-Host "Changelog entry found for $version"
          } else {
            Write-Error "No changelog entry found for $version in CHANGELOG.md. Update CHANGELOG.md before tagging."
            exit 1
          }

          # GitHub Actions multiline output
          "BODY<<EOF"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # ── Install PAC CLI ───────────────────────────────────────────────────
      - name: Install PAC CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      # ── Pack unmanaged ────────────────────────────────────────────────────
      - name: Pack solution (unmanaged)
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: PowerPlatformMonitoringFramework
          solution-file: out/PowerPlatformMonitoringFramework_${{ steps.version.outputs.VERSION }}_unmanaged.zip
          solution-type: Unmanaged
          process-canvas-apps: false

      # ── Flip Solution.xml to Managed for managed pack ─────────────────────
      - name: Set Solution.xml Managed flag
        shell: pwsh
        run: |
          $path = "PowerPlatformMonitoringFramework/Other/Solution.xml"
          (Get-Content $path -Raw) -replace '<Managed>0</Managed>', '<Managed>1</Managed>' |
            Set-Content $path -NoNewline
          Write-Host "Solution.xml <Managed> set to 1"

      # ── Pack managed ──────────────────────────────────────────────────────
      - name: Pack solution (managed)
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: PowerPlatformMonitoringFramework
          solution-file: out/PowerPlatformMonitoringFramework_${{ steps.version.outputs.VERSION }}_managed.zip
          solution-type: Managed
          process-canvas-apps: false

      # ── Create GitHub Release ─────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Power Platform Monitoring Framework ${{ steps.version.outputs.TAG }}"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: ${{ steps.changelog.outputs.BODY }}
          files: |
            out/PowerPlatformMonitoringFramework_${{ steps.version.outputs.VERSION }}_unmanaged.zip
            out/PowerPlatformMonitoringFramework_${{ steps.version.outputs.VERSION }}_managed.zip

      # ── Deploy managed to Production ──────────────────────────────────────
      - name: Generate deployment settings
        shell: pwsh
        run: |
          $settings = @{
            EnvironmentVariables = @()
            ConnectionReferences  = @(
              @{ LogicalName = "ppmf_DataverseConnectionReference";  ConnectionId = "${{ secrets.PP_DV_CONNECTION_ID }}" }
              @{ LogicalName = "ppmf_TeamsConnectionReference";      ConnectionId = "${{ secrets.PP_TEAMS_CONNECTION_ID }}" }
              @{ LogicalName = "ppmf_SharePointConnectionReference"; ConnectionId = "${{ secrets.PP_SP_CONNECTION_ID }}" }
            )
          }
          $settings | ConvertTo-Json -Depth 5 | Set-Content out/deploymentsettings.json
          Write-Host "Deployment settings written."

      - name: Import managed solution to Production
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ secrets.PP_PROD_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          cloud: UsGovHigh
          solution-file: out/PowerPlatformMonitoringFramework_${{ steps.version.outputs.VERSION }}_managed.zip
          deployment-settings-file: out/deploymentsettings.json
          force-overwrite: true
          publish-changes: true
          skip-dependency-check: false

      # ── Re-activate flows (managed import always deactivates them) ─────────
      - name: Re-activate PPMF flows
        shell: pwsh
        run: |
          $flowsToActivate = @(
            "PPMF-Child-Flow Error Handler-JSON"
            "PPMF-Child-Flow Error Handler-Parameters"
            "PPMF-Child-FlowErrorHandler-SharePoint"
            "PPMF-Child-Flow Write to Intake List"
            "PPMF-Child-ProcessFlowError"
            "PPMF-Child-WriteErrorToSharePoint"
            "PPMF-Delete-Old-Errors"
            "PPMF-Get-Environment-Info"
            "PPMF-Power-Apps-Error-Handler-JSON"
          )

          $baseUrl = "${{ secrets.PP_PROD_ENVIRONMENT_URL }}".TrimEnd('/')
          $secret  = ConvertTo-SecureString "${{ secrets.PP_CLIENT_SECRET }}" -AsPlainText -Force

          $tokenBody = @{
            grant_type    = 'client_credentials'
            client_id     = "${{ secrets.PP_CLIENT_ID }}"
            client_secret = [System.Net.NetworkCredential]::new('', $secret).Password
            resource      = $baseUrl
          }

          $savedVerbose = $VerbosePreference; $VerbosePreference = 'SilentlyContinue'
          try {
            $token = (Invoke-RestMethod -Uri "https://login.microsoftonline.us/${{ secrets.PP_TENANT_ID }}/oauth2/token" `
              -Method Post -Body $tokenBody -TimeoutSec 30 -ErrorAction Stop).access_token
          } finally {
            $VerbosePreference = $savedVerbose
            $tokenBody = $null
          }

          $headers = @{
            Authorization      = "Bearer $token"
            'OData-Version'    = '4.0'
            'OData-MaxVersion' = '4.0'
            Accept             = 'application/json'
            'Content-Type'     = 'application/json'
          }

          $flows = (Invoke-RestMethod `
            -Uri "$baseUrl/api/data/v9.2/workflows?`$filter=startswith(name,'PPMF-')&`$select=workflowid,name,statecode" `
            -Headers $headers -TimeoutSec 30 -ErrorAction Stop).value

          foreach ($flowName in $flowsToActivate) {
            $flow = $flows | Where-Object { $_.name -eq $flowName } | Select-Object -First 1
            if (-not $flow)               { Write-Warning "  Not found: $flowName"; continue }
            if ($flow.statecode -eq 1)    { Write-Host "  Already active: $flowName"; continue }
            Invoke-RestMethod `
              -Uri     "$baseUrl/api/data/v9.2/workflows($($flow.workflowid))" `
              -Method  Patch `
              -Headers $headers `
              -Body    '{"statecode":1,"statuscode":2}' `
              -TimeoutSec 30 -ErrorAction Stop | Out-Null
            Write-Host "  Activated: $flowName"
          }

      # ── Post-deploy health check ──────────────────────────────────────────
      - name: Deployment health check
        shell: pwsh
        run: |
          $secret = ConvertTo-SecureString "${{ secrets.PP_CLIENT_SECRET }}" -AsPlainText -Force
          .\scripts\Test-PPMFDeployment.ps1 `
            -EnvironmentUrl  "${{ secrets.PP_PROD_ENVIRONMENT_URL }}" `
            -ClientId        "${{ secrets.PP_CLIENT_ID }}" `
            -ClientSecret    $secret `
            -TenantId        "${{ secrets.PP_TENANT_ID }}" `
            -Cloud           "UsGovHigh" `
            -ExpectedVersion "${{ steps.version.outputs.VERSION }}"

      # ── Sync main back into dev ───────────────────────────────────────────
      # Keeps dev in sync with main after a release merge, preventing GitHub
      # from showing a "Compare & pull request" banner on every page load.
      - name: Sync main into dev
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git checkout dev
          git merge origin/main --no-edit
          git push origin dev
